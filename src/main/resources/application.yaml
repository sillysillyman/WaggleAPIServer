app:
  cookie:
    domain: ${COOKIE_DOMAIN}
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  temperature:
    sensitivity: ${TEMPERATURE_SENSITIVITY:0.1}
  s3:
    base-url: ${S3_BASE_URL}
    bucket: ${S3_BUCKET}
    presigned-url-expiration: 600
    region: ${AWS_REGION:ap-northeast-2}

jwt:
  access-token-ttl: 3600000
  refresh-token-ttl: 604800000
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

server:
  shutdown: graceful

spring:
  application:
    name: WaggleAPIServer

  data:
    redis:
      # 조회수 집계가 GET /posts를 타므로 Redis 무응답이 요청 스레드를 잡아두지 않게 끊음
      # 미설정 시 Lettuce 기본값 60초라 스레드 고갈로 전체 API가 멈춤. 루프백 왕복은 1ms 미만
      timeout: 1s

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      shutdown:
        # 조회수 flush는 Redis에서 증분을 지운 뒤 DB에 반영하므로 중간에 잘리면 복구 불가
        await-termination: true
        await-termination-period: 10s

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile
          kakao:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-id: ${KAKAO_CLIENT_ID}
            client-name: kakao
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: alpha
    path: /swagger-ui.html
    tags-sorter: alpha
